<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>barry-workflow v4 — FSM 状态机</title>
<style>
  :root {
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-2: #eef2f7;
    --border: #d0d7de;
    --fg: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --orange: #bc4c00;
    --orange-soft: #fff1e5;
    --green: #1a7f37;
    --green-soft: #dafbe1;
    --red: #cf222e;
    --red-soft: #ffebe9;
    --purple: #8250df;
    --purple-soft: #fbefff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Helvetica, sans-serif;
    height: 100%;
  }
  header {
    padding: 16px 26px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  main {
    display: grid;
    grid-template-columns: 1fr 540px;
    height: calc(100vh - 78px);
  }
  #fsm {
    position: relative;
    background:
      radial-gradient(circle at 20% 20%, rgba(9,105,218,0.05), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(188,76,0,0.05), transparent 50%),
      var(--bg);
    overflow: hidden;
  }
  svg.canvas { width: 100%; height: 100%; }
  .node-g { cursor: pointer; }
  .node-rect {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5;
    transition: all 0.18s ease;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.04));
  }
  .node-g:hover .node-rect {
    stroke: var(--accent);
    fill: var(--accent-soft);
  }
  .node-g.active .node-rect {
    stroke: var(--orange);
    stroke-width: 2.5;
    fill: var(--orange-soft);
  }
  .node-title {
    font-size: 17px; font-weight: 600;
    fill: var(--fg); text-anchor: middle; pointer-events: none;
  }
  .node-sub {
    font-size: 11px; fill: var(--muted);
    text-anchor: middle; pointer-events: none;
  }
  .node-badge {
    font-size: 10px; fill: var(--accent);
    text-anchor: middle; pointer-events: none;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .edge {
    stroke: #6e7781;
    stroke-width: 1.6;
    fill: none;
    marker-end: url(#arrow);
  }
  .edge.anomaly {
    stroke: var(--red);
    stroke-dasharray: 5 4;
    marker-end: url(#arrow-red);
  }
  .edge.completion {
    stroke: var(--green);
    stroke-dasharray: 5 4;
    marker-end: url(#arrow-green);
  }
  .edge-label {
    font-size: 11px; fill: var(--muted); text-anchor: middle;
    font-family: ui-monospace, "SF Mono", monospace;
  }

  aside {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px 22px;
    overflow-y: auto;
  }
  aside .empty {
    color: var(--muted); font-style: italic;
    margin-top: 36%; text-align: center; font-size: 13px;
  }
  aside h2 { margin: 0 0 4px; font-size: 16px; color: var(--orange); }
  aside .scenario-tabs {
    display: flex; gap: 6px; margin: 12px 0 8px;
    flex-wrap: wrap;
  }
  aside .scenario-tabs button {
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s ease;
  }
  aside .scenario-tabs button:hover {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  aside .scenario-tabs button.on {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  aside .scenario-title {
    font-size: 12px; color: var(--muted); margin: 6px 0 8px;
    font-family: ui-monospace, monospace;
  }
  aside .subdiagram {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin: 8px 0 14px;
  }
  aside .subdiagram svg { width: 100%; height: 280px; }
  aside .notes {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--fg);
  }
  aside .notes ul { margin: 0 0 8px; padding-left: 18px; }
  aside .notes li { margin-bottom: 3px; }
  aside .notes code {
    font-family: ui-monospace, "SF Mono", monospace;
    background: var(--purple-soft);
    color: var(--purple);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11.5px;
  }
  aside .notes b { color: var(--orange); }
  /* sub-diagram styling */
  .sd-node { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
  .sd-node.start { fill: var(--accent-soft); stroke: var(--accent); }
  .sd-node.decision { fill: #fff8c5; stroke: #bf8700; }
  .sd-node.end-ok { fill: var(--green-soft); stroke: var(--green); }
  .sd-node.end-bad { fill: var(--red-soft); stroke: var(--red); }
  .sd-text { font-size: 11px; fill: var(--fg); text-anchor: middle; pointer-events: none; }
  .sd-text.muted { fill: var(--muted); font-size: 10px; }
  .sd-edge { stroke: #8c959f; stroke-width: 1.2; fill: none; marker-end: url(#sd-arrow); }
  .sd-edge-label { font-size: 10px; fill: var(--muted); text-anchor: middle; font-family: ui-monospace, monospace; }

  .legend {
    position: absolute; bottom: 12px; left: 14px;
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px; color: var(--muted);
    font-family: ui-monospace, monospace;
  }
  .legend .line { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .legend .swatch { width: 24px; height: 2px; }
</style>
</head>
<body>
<header>
  <h1>barry-workflow v4 — FSM 状态机</h1>
  <div class="sub">点击状态查看内部子流程 · 多分支可切换 · 11 commits · P8 demo 待用户监督</div>
</header>

<main>
  <div id="fsm">
    <svg class="canvas" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
        </marker>
        <marker id="sd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
        </marker>
      </defs>

      <path class="edge" d="M 200,170 L 350,170"/>
      <text class="edge-label" x="275" y="160">BOOT_DONE</text>

      <path class="edge" d="M 500,170 L 650,170"/>
      <text class="edge-label" x="575" y="160">PREPARE_DONE</text>

      <path class="edge" d="M 720,220 L 720,360"/>
      <text class="edge-label" x="760" y="295">REFLECT_DONE</text>

      <path class="edge anomaly" d="M 600,400 Q 460,310 580,225"/>
      <text class="edge-label" x="490" y="320" fill="#cf222e">EXECUTE_EXIT (bug)</text>

      <path class="edge completion" d="M 600,420 Q 350,500 425,225"/>
      <text class="edge-label" x="380" y="500" fill="#1a7f37">EXECUTE_EXIT (done)</text>

      <g class="node-g" data-state="BOOT" transform="translate(50,120)">
        <rect class="node-rect" width="150" height="100" rx="10"/>
        <text class="node-title" x="75" y="42">BOOT</text>
        <text class="node-sub"   x="75" y="62">session 启动</text>
        <text class="node-badge" x="75" y="82">session_boot.sh</text>
      </g>

      <g class="node-g" data-state="PREPARE" transform="translate(350,120)">
        <rect class="node-rect" width="150" height="100" rx="10"/>
        <text class="node-title" x="75" y="42">PREPARE</text>
        <text class="node-sub"   x="75" y="62">缓存自报 + 4 要素</text>
        <text class="node-badge" x="75" y="82">prepare_helper.sh</text>
      </g>

      <g class="node-g" data-state="REFLECT" transform="translate(650,120)">
        <rect class="node-rect" width="150" height="100" rx="10"/>
        <text class="node-title" x="75" y="42">REFLECT</text>
        <text class="node-sub"   x="75" y="62">subagent rebuttal</text>
        <text class="node-badge" x="75" y="82">N=5 / SendMessage</text>
      </g>

      <g class="node-g" data-state="EXECUTE_LOOP" transform="translate(525,360)">
        <rect class="node-rect" width="200" height="100" rx="10"/>
        <text class="node-title" x="100" y="42">EXECUTE_LOOP</text>
        <text class="node-sub"   x="100" y="62">[PLAN]→tool→[OBSERVE]</text>
        <text class="node-badge" x="100" y="82">execute_loop_audit.sh</text>
      </g>

      <g class="node-g" data-state="END" transform="translate(50,360)">
        <rect class="node-rect" width="150" height="100" rx="10"/>
        <text class="node-title" x="75" y="42">END</text>
        <text class="node-sub"   x="75" y="62">/goal 自动 clear</text>
        <text class="node-badge" x="75" y="82">stop 允许</text>
      </g>
    </svg>

    <div class="legend">
      <div class="line"><span class="swatch" style="background:#6e7781"></span> 正常转换</div>
      <div class="line"><span class="swatch" style="border-top: 2px dashed #cf222e; height:0;"></span> 异常退出</div>
      <div class="line"><span class="swatch" style="border-top: 2px dashed #1a7f37; height:0;"></span> 完成退出</div>
    </div>
  </div>

  <aside id="detail">
    <div class="empty">← 点击左边任意一个状态查看子流程图</div>
  </aside>
</main>

<script>
// Each sub-diagram returns an inline SVG (300×280 viewbox). Scenarios are
// keyed strings; default scenario is the first key in `scenarios`.

const BOOT_DIAGRAM = `
<svg viewBox="0 0 460 280">
  <defs><marker id="sd-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
  <g><rect class="sd-node start" x="20" y="20" width="140" height="44" rx="8"/><text class="sd-text" x="90" y="40">用户首次发消息</text><text class="sd-text muted" x="90" y="55">UserPromptSubmit 触发</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow2)" d="M 160,42 L 200,42"/>
  <g><rect class="sd-node decision" x="200" y="20" width="180" height="44" rx="8"/><text class="sd-text" x="290" y="38">$PWD 有 .git / CLAUDE.md / workspace ?</text><text class="sd-text muted" x="290" y="55">session_boot.sh 启发式</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow2)" d="M 290,64 L 290,110"/>
  <text class="sd-edge-label" x="305" y="85">是</text>
  <path class="sd-edge" marker-end="url(#sd-arrow2)" d="M 380,42 Q 420,42 420,140 Q 420,240 70,240 L 50,240"/>
  <text class="sd-edge-label" x="420" y="155">否 → 跳过</text>
  <g><rect class="sd-node" x="200" y="110" width="180" height="44" rx="8"/><text class="sd-text" x="290" y="128">mkdir .barry_workflow/</text><text class="sd-text muted" x="290" y="145">从 template 生成 state + action</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow2)" d="M 290,154 L 290,180"/>
  <g><rect class="sd-node" x="200" y="180" width="180" height="44" rx="8"/><text class="sd-text" x="290" y="198">main 写 [BOOT_DONE @ ts]</text><text class="sd-text muted" x="290" y="213">到 action_&lt;sid&gt;.md</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow2)" d="M 290,224 L 290,250"/>
  <g><rect class="sd-node end-ok" x="200" y="250" width="180" height="24" rx="6"/><text class="sd-text" x="290" y="266">transition.sh BOOT_DONE → PREPARE</text></g>
  <g><rect class="sd-node end-bad" x="20" y="226" width="80" height="24" rx="6"/><text class="sd-text" x="60" y="242">no-op</text></g>
</svg>`;

const PREPARE_DIAGRAM = `
<svg viewBox="0 0 460 280">
  <defs><marker id="sd-arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
  <g><rect class="sd-node start" x="160" y="10" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="32">prepare_helper.sh</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 200,44 L 110,80"/>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 260,44 L 350,80"/>
  <!-- Track A: cache -->
  <g><rect class="sd-node" x="20" y="80" width="190" height="40" rx="6"/><text class="sd-text" x="115" y="98">A: 列 artifacts + sha1</text><text class="sd-text muted" x="115" y="112">cache_hit_map stub (UNKNOWN)</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 115,120 L 115,150"/>
  <g><rect class="sd-node decision" x="20" y="150" width="190" height="40" rx="6"/><text class="sd-text" x="115" y="168">main 自报: 在 KV cache 吗?</text><text class="sd-text muted" x="115" y="182">YES / NO / 误判→violation</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 60,190 L 60,220"/>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 170,190 L 170,220"/>
  <g><rect class="sd-node end-ok" x="20" y="220" width="80" height="30" rx="6"/><text class="sd-text" x="60" y="240">YES: 跳过</text></g>
  <g><rect class="sd-node end-bad" x="130" y="220" width="80" height="30" rx="6"/><text class="sd-text" x="170" y="240">NO: Read</text></g>
  <!-- Track B: prompt 4-element -->
  <g><rect class="sd-node" x="260" y="80" width="180" height="40" rx="6"/><text class="sd-text" x="350" y="98">B: 4 要素检查</text><text class="sd-text muted" x="350" y="112">observable/cadence/reflect/done</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 350,120 L 350,150"/>
  <g><rect class="sd-node decision" x="260" y="150" width="180" height="40" rx="6"/><text class="sd-text" x="350" y="168">齐全?</text></g>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 305,190 L 305,220"/>
  <path class="sd-edge" marker-end="url(#sd-arrow3)" d="M 395,190 L 395,220"/>
  <g><rect class="sd-node end-ok" x="260" y="220" width="90" height="30" rx="6"/><text class="sd-text" x="305" y="240">是: 继续</text></g>
  <g><rect class="sd-node end-bad" x="355" y="220" width="85" height="30" rx="6"/><text class="sd-text" x="397" y="236">否: [PROMPT_</text><text class="sd-text" x="397" y="247">REINFORCED]</text></g>
</svg>`;

// REFLECT 三个场景共用同一套 rebuttal 骨架，只换 reason 参数 + 验证轴 label。
function reflectDiagram(reason, axisText, entryText, entryClass) {
  return `
<svg viewBox="0 0 460 290">
  <g><rect class="sd-node ${entryClass}" x="20" y="6" width="420" height="26" rx="6"/><text class="sd-text" x="230" y="23">${entryText}</text></g>
  <path class="sd-edge" d="M 230,32 L 230,52"/>
  <g><rect class="sd-node" x="20" y="52" width="200" height="46" rx="6"/><text class="sd-text" x="120" y="70">main 写 reflection_${reason}.md</text><text class="sd-text muted" x="120" y="85">3-7 个具体问题 (引文件/log行)</text></g>
  <path class="sd-edge" d="M 220,75 L 260,75"/>
  <g><rect class="sd-node" x="260" y="52" width="180" height="46" rx="6"/><text class="sd-text" x="350" y="70">Agent(bg=true)</text><text class="sd-text muted" x="350" y="85">reason=${reason}</text></g>
  <path class="sd-edge" d="M 350,98 L 350,120"/>
  <g><rect class="sd-node" x="260" y="120" width="180" height="46" rx="6"/><text class="sd-text" x="350" y="138">agent: 写 reviewer reply</text><text class="sd-text muted" x="350" y="153">轴: ${axisText}</text></g>
  <path class="sd-edge" d="M 350,166 L 350,188"/>
  <g><rect class="sd-node" x="260" y="188" width="180" height="36" rx="6"/><text class="sd-text" x="350" y="206">sleep 30; done 等 SendMessage</text></g>
  <path class="sd-edge" d="M 260,206 Q 200,206 200,140"/>
  <text class="sd-edge-label" x="180" y="180">round N+1</text>
  <g><rect class="sd-node decision" x="20" y="120" width="180" height="46" rx="6"/><text class="sd-text" x="110" y="138">main: 收敛?</text><text class="sd-text muted" x="110" y="153">SendMessage 继续 or CONSENSUS</text></g>
  <path class="sd-edge" d="M 110,166 L 110,210"/>
  <text class="sd-edge-label" x="80" y="190">是</text>
  <g><rect class="sd-node end-ok" x="20" y="210" width="180" height="30" rx="6"/><text class="sd-text" x="110" y="230">[CONSENSUS_REACHED]</text></g>
  <path class="sd-edge" d="M 110,240 L 110,260"/>
  <g><rect class="sd-node end-ok" x="20" y="260" width="180" height="24" rx="6"/><text class="sd-text" x="110" y="276">transition.sh REFLECT_DONE</text></g>
  <path class="sd-edge" d="M 200,143 Q 230,143 230,260 L 260,260"/>
  <text class="sd-edge-label" x="250" y="200">N≥5</text>
  <g><rect class="sd-node end-bad" x="260" y="244" width="180" height="36" rx="6"/><text class="sd-text" x="350" y="262">fallback N=10 / 上报</text><text class="sd-text muted" x="350" y="276">写 rule_violations.md</text></g>
</svg>`;
}
const REFLECT_PRE_TASK   = reflectDiagram("pre-task",   "plan 完整性 / observables / 成功条件",       "PREPARE_DONE → REFLECT (pre-task)",   "start");
const REFLECT_ON_ANOMALY = reflectDiagram("on-anomaly", "假设 vs 证据 / 替代根因 / 治标 vs 治本",      "EXECUTE_EXIT --reason=bug → REFLECT", "end-bad");
const REFLECT_POST_TASK  = reflectDiagram("post-task",  "deliverable vs goal.md / ledger 收尾",       "EXECUTE_EXIT --reason=done → REFLECT", "end-ok");

const EXEC_CONTINUE = `
<svg viewBox="0 0 460 280">
  <g><rect class="sd-node start" x="160" y="10" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="32">迭代 N 开始</text></g>
  <path class="sd-edge" d="M 230,44 L 230,70"/>
  <g><rect class="sd-node" x="160" y="70" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="92">写 [PLAN] 一行</text></g>
  <path class="sd-edge" d="M 230,104 L 230,130"/>
  <g><rect class="sd-node" x="160" y="130" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="152">调工具 (Read/Edit/Bash)</text></g>
  <path class="sd-edge" d="M 230,164 L 230,190"/>
  <g><rect class="sd-node" x="160" y="190" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="212">写 [OBSERVE]</text></g>
  <path class="sd-edge" d="M 230,224 L 230,250"/>
  <g><rect class="sd-node end-ok" x="160" y="250" width="140" height="24" rx="6"/><text class="sd-text" x="230" y="267">符合 PLAN → 下一迭代</text></g>
  <path class="sd-edge" d="M 300,262 Q 420,262 420,27 Q 420,10 320,27"/>
  <text class="sd-edge-label" x="430" y="150">回环</text>
</svg>`;

const EXEC_ANOMALY = `
<svg viewBox="0 0 460 280">
  <g><rect class="sd-node" x="160" y="10" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="32">迭代 N [OBSERVE]</text></g>
  <path class="sd-edge" d="M 230,44 L 230,70"/>
  <g><rect class="sd-node decision" x="160" y="70" width="140" height="40" rx="6"/><text class="sd-text" x="230" y="88">反驳 PLAN?</text><text class="sd-text muted" x="230" y="103">fail / anomaly / refuted</text></g>
  <path class="sd-edge" d="M 230,110 L 230,135"/>
  <g><rect class="sd-node" x="160" y="135" width="140" height="34" rx="6"/><text class="sd-text" x="230" y="157">anomaly 计数 +1</text></g>
  <path class="sd-edge" d="M 230,169 L 230,195"/>
  <g><rect class="sd-node decision" x="120" y="195" width="220" height="40" rx="6"/><text class="sd-text" x="230" y="213">连续 3 个 anomaly?</text><text class="sd-text muted" x="230" y="228">p6_workflow.md M6 失败预算</text></g>

const aside = document.getElementById("detail");
let cur = null;

function render(state) {
  cur = state;
  const d = DETAILS[state];
  document.querySelectorAll(".node-g").forEach(n => n.classList.toggle("active", n.dataset.state === state));
  const scenarios = Object.keys(d.scenarios);
  const tabs = scenarios.map((s, i) =>
    `<button class="${i===0?'on':''}" data-s="${s}">${s}</button>`
  ).join("");
  aside.innerHTML = `
    <h2>${d.title}</h2>
    ${scenarios.length > 1 ? `<div class="scenario-tabs">${tabs}</div>` : ''}
    <div class="scenario-title" id="sc-title"></div>
    <div class="subdiagram" id="sd"></div>
    <div class="notes" id="notes"></div>
  `;
  if (scenarios.length > 1) {
    aside.querySelectorAll(".scenario-tabs button").forEach(b => {
      b.addEventListener("click", () => {
        aside.querySelectorAll(".scenario-tabs button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        showScenario(state, b.dataset.s);
      });
    });
  }
  showScenario(state, scenarios[0]);
}

function showScenario(state, name) {
  const sc = DETAILS[state].scenarios[name];
  aside.querySelector("#sc-title").textContent = "场景: " + name;
  aside.querySelector("#sd").innerHTML = sc.diagram;
  aside.querySelector("#notes").innerHTML = sc.notes;
}

document.querySelectorAll(".node-g").forEach(n => {
  n.addEventListener("click", () => render(n.dataset.state));
});
</script>
