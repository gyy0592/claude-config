<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Barry's Workflow v2 — 实现 walk-through</title>
<style>
  :root {
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-2: #eef2f7;
    --border: #d0d7de;
    --fg: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --orange: #bc4c00;
    --orange-soft: #fff1e5;
    --green: #1a7f37;
    --green-soft: #dafbe1;
    --red: #cf222e;
    --red-soft: #ffebe9;
    --purple: #8250df;
    --purple-soft: #fbefff;
    --yellow-soft: #fff8c5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Helvetica, sans-serif;
    line-height: 1.6;
    height: 100%;
  }
  header {
    padding: 18px 28px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 78px);
  }
  nav {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 12px 0;
    overflow-y: auto;
  }
  nav .grp-title {
    font-size: 11px;
    color: var(--muted);
    padding: 14px 18px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  nav button {
    display: block;
    width: 100%;
    padding: 7px 18px;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    transition: all 0.12s;
  }
  nav button:hover { background: var(--accent-soft); }
  nav button.on {
    background: var(--orange-soft);
    border-left-color: var(--orange);
    color: var(--orange);
    font-weight: 600;
  }
  nav .verdict {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
    padding: 1px 5px;
    border-radius: 8px;
  }
  nav .v-ok { background: var(--green-soft); color: var(--green); }
  nav .v-warn { background: var(--yellow-soft); color: #bf8700; }
  nav .v-bad { background: var(--red-soft); color: var(--red); }
  nav .v-todo { background: var(--panel-2); color: var(--muted); }

  section.detail {
    overflow-y: auto;
    padding: 26px 36px 60px;
    max-width: 980px;
  }
  section.detail h2 {
    margin: 0 0 6px;
    font-size: 22px;
    color: var(--orange);
  }
  section.detail h3 {
    margin: 22px 0 8px;
    font-size: 15px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  section.detail p { margin: 8px 0; font-size: 14px; }
  section.detail ul, section.detail ol { margin: 4px 0; padding-left: 22px; font-size: 14px; }
  section.detail li { margin-bottom: 4px; }
  section.detail code {
    font-family: ui-monospace, "SF Mono", monospace;
    background: var(--purple-soft);
    color: var(--purple);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12.5px;
  }
  section.detail pre {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", monospace;
    line-height: 1.5;
  }
  section.detail pre code { background: transparent; color: var(--fg); padding: 0; }

  .what-why-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 14px 0;
  }
  .cell {
    border-radius: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .cell .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .cell.what { border-left: 3px solid var(--accent); }
  .cell.what .label { color: var(--accent); }
  .cell.why { border-left: 3px solid var(--orange); }
  .cell.why .label { color: var(--orange); }
  .cell.verdict { border-left: 3px solid var(--green); background: var(--green-soft); }
  .cell.verdict.warn { border-left-color: #bf8700; background: var(--yellow-soft); }
  .cell.verdict.bad { border-left-color: var(--red); background: var(--red-soft); }
  .cell.verdict.todo { border-left-color: var(--muted); background: var(--panel-2); }
  .cell.verdict .label { color: inherit; }

  .file-tag {
    display: inline-block;
    background: var(--panel-2);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    margin: 0 6px 4px 0;
    border: 1px solid var(--border);
  }
  .ascii {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre;
    overflow-x: auto;
    margin: 12px 0;
  }
  table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  table th, table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  table th { background: var(--panel-2); font-weight: 600; }

  .callout {
    margin: 14px 0;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
  }
  .callout.note { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .callout.warn { background: var(--yellow-soft); border-left: 3px solid #bf8700; }
  .callout.bad  { background: var(--red-soft); border-left: 3px solid var(--red); }
  .callout.ok   { background: var(--green-soft); border-left: 3px solid var(--green); }
</style>
</head>
<body>
<header>
  <h1>Barry's Workflow v2 — 实现 walk-through</h1>
  <div class="sub">零知识门槛 · 每个文件 What/Why/有效性 都说清楚 · 诚实标 ✅/⚠/❌</div>
</header>

<main>
  <nav>
    <div class="grp-title">第一部分 — 整体</div>
    <button data-key="intro" class="on">0. 这是什么</button>
    <button data-key="problem">1. 解决的问题</button>
    <button data-key="solution">2. 整体架构</button>
    <button data-key="flow">3. 端到端流程</button>

    <div class="grp-title">第二部分 — Seed Rules（10 个 policy 文件）</div>
    <button data-key="p1_identity">p1_identity.md <span class="verdict v-ok">部署</span></button>
    <button data-key="p2_facts">p2_facts_first.md <span class="verdict v-ok">部署</span></button>
    <button data-key="p3_dispatch">p3_dispatch.md <span class="verdict v-ok">部署</span></button>
    <button data-key="p4_recording">p4_recording.md <span class="verdict v-ok">部署</span></button>
    <button data-key="p6_workflow">p6_workflow.md <span class="verdict v-ok">部署</span></button>
    <button data-key="subagent">subagent_rules.md <span class="verdict v-ok">部署</span></button>
    <button data-key="fsm">fsm.md <span class="verdict v-ok">部署</span></button>
    <button data-key="reflect_proto">reflect_protocol.md <span class="verdict v-ok">实测</span></button>
    <button data-key="reflect_prompt">reflect_subagent_prompt.md <span class="verdict v-ok">实测</span></button>
    <button data-key="codex">codex_adapter.md <span class="verdict v-todo">未跑</span></button>
    <button data-key="index_md">index.md <span class="verdict v-ok">部署</span></button>

    <div class="grp-title">第三部分 — Hooks（脚本）</div>
    <button data-key="inject_router">inject_router.sh <span class="verdict v-ok">实测</span></button>
    <button data-key="session_boot">session_boot.sh <span class="verdict v-warn">smoke</span></button>
    <button data-key="transition">transition.sh <span class="verdict v-warn">smoke</span></button>
    <button data-key="prepare_helper">prepare_helper.sh <span class="verdict v-warn">smoke</span></button>
    <button data-key="exec_audit">execute_loop_audit.sh <span class="verdict v-warn">smoke</span></button>
    <button data-key="pre_nudge">pretooluse_short_nudge.sh <span class="verdict v-warn">smoke</span></button>

    <div class="grp-title">第四部分 — 运行时</div>
    <button data-key="per_turn">每轮 vs 每次工具 vs 每个 state</button>
    <button data-key="output_files">产物文件清单</button>
    <button data-key="qa">FAQ — 7 个常见疑问</button>

    <div class="grp-title">第五部分 — 评估</div>
    <button data-key="effectiveness">有效性诚实评估</button>
    <button data-key="reflection">我漏了什么 / 没说清</button>
    <button data-key="next">下一步 v2.1</button>
  </nav>

  <section class="detail" id="detail"></section>
</main>

<script>
const SECTIONS = {
  intro: () => `
    <h2>0. 这是什么</h2>
    <p><b>Barry's Workflow v2</b> 是一套约束 Claude Code（或其他 LLM coding agent）行为的"状态控制器"。不是 prompt 集合，不是 wrapper，是<b>把 AI 的行为切成阶段、强制必须走过每一步</b>的机制。</p>
    <h3>给谁看？</h3>
    <ul>
      <li>已经用过 Claude Code / Cursor / Codex 跑代码任务的人</li>
      <li>经历过"AI 说做完了，结果没跑测试 / 没看 console / 改错地方"的人</li>
      <li>想知道能不能让 AI 工作流可控、可审计、可演化的人</li>
    </ul>
    <h3>这份文档干嘛？</h3>
    <p>1 篇 HTML 把所有实现讲清楚：每个文件干啥、为什么需要、有没有验证过有效。读完 30 分钟你能：</p>
    <ul>
      <li>知道整个系统的形状</li>
      <li>知道哪些是真有用的、哪些只是 smoke-test 没真用过</li>
      <li>判断它适不适合你的工作场景</li>
    </ul>
    <h3>跟原 README 的区别</h3>
    <ul>
      <li>README = 用 + 装</li>
      <li>big_picture.md = 设计哲学</li>
      <li>scenarios.html = 理想行为 spec</li>
      <li>fsm_visualization.html = 状态机视图</li>
      <li><b>本文（implementation.html）= 实际跑的代码每一行为啥存在</b></li>
    </ul>
  `,

  problem: () => `
    <h2>1. 解决的问题 — 跳步病</h2>
    <p>LLM coding agent 有一个非常顽固的失败模式 — 把"接受任务"直接跳到"我做完了"，<b>中间所有验证步骤全省</b>。</p>
    <h3>具体长这样</h3>
    <table>
      <tr><th>任务</th><th>AI 默认反应</th><th>跳过了什么</th></tr>
      <tr><td>"代码慢"</td><td>改 batch_size</td><td>没测 baseline、没 profile、没看 GPU util</td></tr>
      <tr><td>"报 KeyError"</td><td>try/except 包住</td><td>没查为什么 key 不存在</td></tr>
      <tr><td>"写一个 HTML 可视化"</td><td>commit 报"完成"</td><td>没用浏览器打开、没点击验证、没看 console（本会话刚发生过）</td></tr>
      <tr><td>"修 OOM"</td><td>降 batch</td><td>没查 activation memory、没考虑 grad checkpoint</td></tr>
    </table>
    <h3>根因（从训练数据来）</h3>
    <p>GitHub commit / StackOverflow / blog 教程的格式都是 <code>问题 → fix</code>，中间步骤（复现 / 读代码 / 测 baseline / 跑通验证）<b>训练集里压根不出现</b>。AI 学到的就是直接跳。</p>
    <div class="callout note">
      详见 <code>docs/big_picture.md §1.5</code>。本会话第 22 轮我自己就犯了这病 — 写完 HTML 直接 commit，没打开浏览器 → 第二天用户发现点击没反应（JS 字符串引号 bug）。
    </div>
    <h3>反制思路</h3>
    <p>把"跳"切成<b>必须显式走过的多个 state</b>，每个 state 强制有 deliverable，跳了系统能发现并阻止。这就是状态机。</p>
  `,

  solution: () => `
    <h2>2. 整体架构</h2>
    <p>三层。下层支撑上层，上层覆盖下层。</p>
    <div class="ascii">┌─────────────────────────────────────────────────┐
│  Layer 3:  patches/   ← v2.1 计划，目前未实现     │
│            人工或 AI 自动写的结构化补丁             │
└─────────────────────────────────────────────────┘
                  ▲ overrides
┌─────────────────────────────────────────────────┐
│  Layer 2:  seed rules (~/.claude/rules/*.md)    │
│            10 个 policy 文件 — 初始最佳猜测         │
└─────────────────────────────────────────────────┘
                  ▲ enforced by hooks
┌─────────────────────────────────────────────────┐
│  Layer 1:  FSM 骨架  ← 不变量                    │
│            BOOT → PREPARE → REFLECT ↔ EXECUTE   │
│            → END                                │
└─────────────────────────────────────────────────┘</div>
    <h3>FSM 6 状态</h3>
    <ul>
      <li><b>BOOT</b>：session 启动，建状态文件</li>
      <li><b>PREPARE</b>：估算资源、列已知信息、明确完成判据</li>
      <li><b>REFLECT pre-task</b>：派 subagent 验证 plan</li>
      <li><b>EXECUTE_LOOP</b>：执行 + 每步 [PLAN]/[OBSERVE]</li>
      <li><b>REFLECT post-task</b>：派 subagent 验证 deliverable</li>
      <li><b>END</b>：收尾，<code>/goal</code> 自动放行</li>
    </ul>
    <h3>三道防线（对抗跳步病）</h3>
    <ol>
      <li>状态机本身 — 不许跳过任何 state</li>
      <li>REFLECT post-task 6 条 checklist（语法 / 真跑过 / console / violation / goal 对照 / root vs symptom）</li>
      <li>PREPARE 4 要素 prompt enhancement（observable / cadence / reflection / completion）</li>
    </ol>
    <h3>git 仓库构成</h3>
    <ul>
      <li><code>content/rules/*.md</code> — 10 个 policy 文件，源</li>
      <li><code>hooks/*.sh</code> — 7 个脚本，源</li>
      <li><code>set_claude.sh</code> — 部署器，复制以上到 <code>~/.claude/rules/</code> + <code>~/.claude/hooks/</code> + 写 <code>~/.claude/settings.json</code></li>
      <li><code>docs/</code> — 设计文档</li>
    </ul>
  `,

  flow: () => `
    <h2>3. 端到端流程</h2>
    <p>一次完整 session 里、用户从输入 prompt 到 AI 输出结果的所有阶段。</p>
    <div class="ascii">USER: "帮我跑这个训练，监控直到跑完"
        │
        ▼ UserPromptSubmit 触发
┌─────────────────────────────────────────────────┐
│ Hook 1: inject_router.sh                        │
│  → 注入 [ROUTER] 块到 prompt 前面（1.1 KB）       │
│  → 告诉 AI 该读哪个 policy 文件                   │
│                                                 │
│ Hook 2: session_boot.sh                         │
│  → 检查 $PWD 像不像项目根                         │
│  → 没有 state_<sid>.md 就从 template 建          │
│  → 没有 action_<sid>.md 就建                     │
└─────────────────────────────────────────────────┘
        │
        ▼ AI 开始处理 prompt
┌─────────────────────────────────────────────────┐
│ AI 进入 BOOT 状态                                │
│  → 看到 router、知道有 .barry_workflow/          │
│  → 写 [BOOT_DONE @ ts] 到 action.md             │
│  → 调 transition.sh BOOT_DONE → state=PREPARE   │
└─────────────────────────────────────────────────┘
        │
        ▼
┌─────────────────────────────────────────────────┐
│ AI 进入 PREPARE 状态                             │
│  → 跑 prepare_helper.sh                         │
│    输出 cache_hit_map stub + 4 要素 checklist    │
│  → 估算 T_queue / T_run                         │
│  → 调 transition.sh PREPARE_DONE → REFLECT      │
└─────────────────────────────────────────────────┘
        │
        ▼
┌─────────────────────────────────────────────────┐
│ AI 进入 REFLECT pre-task                        │
│  → 写 reflection_r1-pre-task.md                 │
│  → 派 subagent (Agent + run_in_background=true) │
│  → subagent 写 reviewer reply + sleep 等        │
│  → main 看 reply + 可选 SendMessage round 2     │
│  → CONSENSUS_REACHED → transition.sh REFLECT_DONE│
└─────────────────────────────────────────────────┘
        │
        ▼
┌─────────────────────────────────────────────────┐
│ AI 进入 EXECUTE_LOOP                            │
│  循环：                                          │
│    [PLAN] @ ts — 干啥 + 期望 observable          │
│    （PreToolUse: pretooluse_short_nudge.sh 提醒）│
│    工具调用 (Bash / Edit / ...)                  │
│    [OBSERVE] @ ts — 引具体输出                   │
│    判: continue / anomaly+1 / done              │
│  退出: transition.sh EXECUTE_EXIT --reason=done │
└─────────────────────────────────────────────────┘
        │
        ▼
┌─────────────────────────────────────────────────┐
│ AI 进入 REFLECT post-task                       │
│  → 派 subagent 验 deliverable                   │
│  → 6 条 checklist（语法 / 真跑过 / ...）          │
│  → 共识后 transition.sh REFLECT_DONE             │
└─────────────────────────────────────────────────┘
        │
        ▼
┌─────────────────────────────────────────────────┐
│ END：写 ledger 收尾                              │
│  /goal 评估器读 transcript → 满足 → 自动 clear   │
└─────────────────────────────────────────────────┘</div>
    <div class="callout warn">
      <b>当前现状（必须诚实）</b>：上面这套流程在 v2 里<b>都是约定 + 工具</b>，没有 hook 真的强制 AI 走每一步。靠的是 AI 看到 router 注入后自律。一旦 AI 偷懒（跳 transition.sh、跳 prepare_helper.sh），系统没机制拦。所以"状态控制"目前是<b>软约束</b>，不是硬。
    </div>
  `,

  // === policy files ===
  p1_identity: () => policyCard({
    title: "p1_identity.md — 身份策略",
    what: "告诉 AI 它自己是谁（main）、subagent 怎么命名（agent_&lt;aid&gt;）、不许用什么 cosplay 词（Corporal / Commander / Decree）。",
    why: "v1 时代规则里全是军事 cosplay 词，AI 一边记规则一边 cosplay 角色，认知负担大且容易出戏。中性化后 AI 只需要关注行为本身。",
    integrate: "AI 在 router 看到「自我称呼」触发后 Read 此文件。",
    verdict: "ok",
    verdictText: "✅ 部署成功，本会话 AI 全程用 main / user / subagent，无 cosplay 残留。",
    snippet: `### 主要内容
- main = 主线程 AI
- agent_&lt;aid&gt; = subagent
- user = 人
- 禁词清单：Corporal / Commander / Private / Decree / Treason / 军营`,
  }),

  p2_facts: () => policyCard({
    title: "p2_facts_first.md — 事实优先策略",
    what: "强制每个结论打标签：[FACT] 直接观察 / [INFERENCE] 推理（要附理由 + 第二轮反思）/ [ASSUMPTION] 假设（要先做 50+ 搜索）。subagent 报告不算 fact，main 必须自己 Read 原始证据。",
    why: "AI 倾向把 inference 当 fact 报告。这条强制三档分级，让 user 一眼能看出哪些可信、哪些是猜的。",
    integrate: "AI 想写 [INFERENCE] / [ASSUMPTION] 时被 router 提示 Read 此文件。",
    verdict: "ok",
    verdictText: "✅ 部署。本会话有用，比如 rebuttal 时 agent 严格用了 [FACT]/[INFERENCE] 标签。但<b>无自动化强制</b>，AI 偷懒不打标系统抓不到。",
  }),

  p3_dispatch: () => policyCard({
    title: "p3_dispatch.md — 派遣策略",
    what: "规则：(a) Read &gt; 1 文件 / WebSearch / 改代码 / 长任务 → 必须派 subagent；(b) 派的话 <code>run_in_background=true</code> 是强制；(c) 长 bg 任务每 10-15 分钟 Monitor() 一次；(d) 跨 session 用 CronCreate。",
    why: "AI 默认在主线程一个一个 Read，污染 context + 慢。派 subagent 能并行 + 子上下文不污染主。",
    integrate: "PreToolUse nudge hook 监控：调 Bash 跑 sbatch 没设 bg=true → 提醒一句。",
    verdict: "ok",

    <h3>Q3: 进入不同 state 怎么实现？AI 怎么知道？</h3>
    <p><b>实现</b>：main 主动调 <code>bash transition.sh &lt;EVENT&gt;</code>，python 改 state.md YAML 的 current_status。echo 一行到 stdout 当 main 的 Bash 工具回显。</p>
    <p><b>AI 怎么知道进了新 state？</b>当前<b>没有自动提示机制</b>。AI 要主动 Read state.md，或者看 transition.sh 的 stdout 回显。<b>这是真漏洞</b>，v2.1 需要 PostToolUse:Bash hook 监听 transition.sh 输出，自动注入"现在你进入 X，能做 Y 不能做 Z"提示。</p>

    <p>设计上能 — hook 脚本可以读 state.md 然后 case-on-state。<b>当前 pretooluse_short_nudge.sh 没读 state.md</b>，只看 tool_name + tool_input。这是 v2.1 P11「状态强制」核心实现路径：state=PREPARE 时禁 Edit/Write、state=REFLECT 时禁 Bash 改文件，全用 nudge 拦下。</p>

    <h3>Q5: subagent 有 session id？能写自己的 action.md / state.md 吗？</h3>
    <p><b>有 agent_id</b>（Claude Code 派 Agent() 时立刻返回，本会话你看到的 a3cdbcd829a650797、a84882fd4e95d33fd 等 17 字符 hex 串就是）。</p>
    <p><b>设计上完全可以</b>每个 subagent 写到 <code>.barry_workflow/agent_&lt;aid&gt;/{state,action}.md</code>，子 FSM 走 BOOT/PREPARE/EXECUTE 简化版。<b>当前未实现</b>：subagent_rules.md rule B 规定了"写自己的 action.md"，但没 hook 自动建目录、subagent 自己也没机制强制按规则写。这是 v2.1 改善点。</p>

    <h3>Q6: 当前 [ROUTER] 块在哪个文档？</h3>
    <p><b>是单独的 .md 文件</b>：<code>content/rules/router.md</code>（source-of-truth）→ <code>set_claude.sh</code> 部署到 <code>~/.claude/rules/router.md</code> → <code>hooks/inject_router.sh</code> 每轮 <code>cat</code> 它。</p>
