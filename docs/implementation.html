<head>
<meta charset="utf-8">
<title>Barry's Workflow v2.1 — 实现 walk-through</title>
<style>
  :root {
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-2: #eef2f7;
    --border: #d0d7de;
    --fg: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --orange: #bc4c00;
    --orange-soft: #fff1e5;
    --green: #1a7f37;
    --green-soft: #dafbe1;
    --red: #cf222e;
    --red-soft: #ffebe9;
    --purple: #8250df;
    --purple-soft: #fbefff;
    --yellow-soft: #fff8c5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Helvetica, sans-serif;
    line-height: 1.6;
    height: 100%;
  }
  header {
    padding: 18px 28px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 78px);
  }
  nav {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 12px 0;
    overflow-y: auto;
  }
  nav .grp-title {
    font-size: 11px;
    color: var(--muted);
    padding: 14px 18px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  nav button {
    display: block;
    width: 100%;
    padding: 7px 18px;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    transition: all 0.12s;
  }
  nav button:hover { background: var(--accent-soft); }
  nav button.on {
    background: var(--orange-soft);
    border-left-color: var(--orange);
    color: var(--orange);
    font-weight: 600;
  }
  nav .verdict {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
    padding: 1px 5px;
    border-radius: 8px;
  }
  nav .v-ok { background: var(--green-soft); color: var(--green); }
  nav .v-warn { background: var(--yellow-soft); color: #bf8700; }
  nav .v-bad { background: var(--red-soft); color: var(--red); }
  nav .v-todo { background: var(--panel-2); color: var(--muted); }
  nav .v-new { background: var(--purple-soft); color: var(--purple); }

  section.detail {
    overflow-y: auto;
    padding: 26px 36px 60px;
    max-width: 980px;
  }
  section.detail h2 {
    margin: 0 0 6px;
    font-size: 22px;
    color: var(--orange);
  }
  section.detail h3 {
    margin: 22px 0 8px;
    font-size: 15px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  section.detail p { margin: 8px 0; font-size: 14px; }
  section.detail ul, section.detail ol { margin: 4px 0; padding-left: 22px; font-size: 14px; }
  section.detail li { margin-bottom: 4px; }
  section.detail code {
    font-family: ui-monospace, "SF Mono", monospace;
    background: var(--purple-soft);
    color: var(--purple);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12.5px;
  }
  section.detail pre {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", monospace;
    line-height: 1.5;
  }
  section.detail pre code { background: transparent; color: var(--fg); padding: 0; }

  .what-why-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 14px 0;
  }
  .cell {
    border-radius: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .cell .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .cell.what { border-left: 3px solid var(--accent); }
  .cell.what .label { color: var(--accent); }
  .cell.why { border-left: 3px solid var(--orange); }
  .cell.why .label { color: var(--orange); }
  .cell.verdict { border-left: 3px solid var(--green); background: var(--green-soft); }
  .cell.verdict.warn { border-left-color: #bf8700; background: var(--yellow-soft); }
  .cell.verdict.bad { border-left-color: var(--red); background: var(--red-soft); }
  .cell.verdict.todo { border-left-color: var(--muted); background: var(--panel-2); }
  .cell.verdict .label { color: inherit; }

  .file-tag {
    display: inline-block;
    background: var(--panel-2);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    margin: 0 6px 4px 0;
    border: 1px solid var(--border);
  }
  .ascii {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre;
    overflow-x: auto;
    margin: 12px 0;
  }
  table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  table th, table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  table th { background: var(--panel-2); font-weight: 600; }

  .callout {
    margin: 14px 0;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
  }
  .callout.note { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .callout.warn { background: var(--yellow-soft); border-left: 3px solid #bf8700; }
  .callout.bad  { background: var(--red-soft); border-left: 3px solid var(--red); }
  .callout.ok   { background: var(--green-soft); border-left: 3px solid var(--green); }
</style>

<script>
const SECTIONS = {
  intro: () => `
    <h2>0. 这是什么</h2>
    <p><b>Barry's Workflow v2.1</b> 是一套约束 Claude Code（或其他 LLM coding agent）行为的"状态控制器"。不是 prompt 集合，不是 wrapper，是<b>把 AI 的行为切成阶段、强制必须走过每一步</b>的机制。</p>
    <p><b>v2.1 + v2.1+ 已落地</b>（commits 1616bd0–11c0e40）：state-aware router（按当前 state 注入不同 router 文件）、INFERENCE_GATE（写 [INFERENCE] 前先 mini-rebuttal）、patches 系统（场景专属补丁与 general 规则分离）、session 子目录（<code>.barry_workflow/&lt;sid&gt;/...</code> 替代平铺）、PostToolUse 状态强制 hook、规则文件大重构（删 v1 残留 / 拆 fsm.md → 5 个 state 文件 / 抢救 M6）、外置 workflow_config.yaml 常量、跨 session inherit 基础、states/*.md 全 pipeline + router 瘦身（P28）、v1 残留全清（P29）、transition logging（P30）。</p>
    <p><b>P8 end-to-end demo PASSED</b>（2026-05-14, awesome-gpu-name 云端）：让 cloud claude 自己接入新 repo，完整走 FSM、建 5 个 ledger、归档 v1 残留。FSM / router / subagent / session_boot 4 项 check 全过；4 个非阻断 issue 记录在 <code>docs/p8_e2e_notes.md</code>。</p>
    <h3>给谁看？</h3>
    <ul>
      <li>已经用过 Claude Code / Cursor / Codex 跑代码任务的人</li>
      <li>经历过"AI 说做完了，结果没跑测试 / 没看 console / 改错地方"的人</li>
      <li>想知道能不能让 AI 工作流可控、可审计、可演化的人</li>
    </ul>
    <h3>这份文档干嘛？</h3>
    <p>1 篇 HTML 把所有实现讲清楚：每个文件干啥、为什么需要、有没有验证过有效。读完 30 分钟你能：</p>
    <ul>
      <li>知道整个系统的形状</li>
      <li>知道哪些是真有用的、哪些只是 smoke-test 没真用过</li>
      <li>判断它适不适合你的工作场景</li>
    </ul>
    <h3>跟原 README 的区别</h3>
    <ul>
      <li>README = 用 + 装</li>
      <li>big_picture.md / big_picture.html = 设计哲学</li>
      <li>scenarios.html = 理想行为 spec</li>
      <li>fsm_visualization.html = 状态机视图</li>
      <li><b>本文（implementation.html）= 实际跑的代码每一行为啥存在</b></li>
    </ul>
  `,

  problem: () => `
    <h2>1. 解决的问题 — 跳步病</h2>
    <p>LLM coding agent 有一个非常顽固的失败模式 — 把"接受任务"直接跳到"我做完了"，<b>中间所有验证步骤全省</b>。</p>
    <h3>具体长这样</h3>
    <table>
      <tr><th>任务</th><th>AI 默认反应</th><th>跳过了什么</th></tr>
      <tr><td>「代码慢」</td><td>改 batch_size</td><td>没测 baseline、没 profile、没看 GPU util</td></tr>
      <tr><td>「报 KeyError」</td><td>try/except 包住</td><td>没查为什么 key 不存在</td></tr>
      <tr><td>「写一个 HTML 可视化」</td><td>commit 报「完成」</td><td>没用浏览器打开、没点击验证、没看 console（本会话刚发生过）</td></tr>
      <tr><td>「修 OOM」</td><td>降 batch</td><td>没查 activation memory、没考虑 grad checkpoint</td></tr>
    </table>
    <h3>根因（从训练数据来）</h3>
    <p>GitHub commit / StackOverflow / blog 教程的格式都是 <code>问题 → fix</code>，中间步骤（复现 / 读代码 / 测 baseline / 跑通验证）<b>训练集里压根不出现</b>。AI 学到的就是直接跳。</p>
    <div class="callout note">
      详见 <code>docs/big_picture.md §1.5</code>。
    </div>
    <h3>反制思路</h3>
    <p>把"跳"切成<b>必须显式走过的多个 state</b>，每个 state 强制有 deliverable，跳了系统能发现并阻止。这就是状态机。v2.1 加了 PostToolUse 状态强制（<code>state_enforce.sh</code>）作为"软约束 → 硬约束"的第一步。</p>
  `,

  solution: () => `
    <h2>2. 整体架构 (v2.1)</h2>
    <p>三层。下层支撑上层，上层覆盖下层。</p>
    <div class="ascii">┌─────────────────────────────────────────────────┐
│  Layer 3: patches/ (5 个 scenario 补丁 — v2.1 ✅) │
│           long_monitor / bug_debug / perf_debug  │
│           simple_fast / exploration              │
└─────────────────────────────────────────────────┘
                  ▲ overrides
┌─────────────────────────────────────────────────┐
│  Layer 2:  seed rules — 顶层 policy + states/    │
│            9 顶层 policy + 5 states + 5 routers   │
│            + 2 messages + 1 workflow_config.yaml │
└─────────────────────────────────────────────────┘
                  ▲ enforced by hooks
┌─────────────────────────────────────────────────┐
│  Layer 1:  FSM 骨架  ← 不变量                    │
│  BOOT → PREPARE → REFLECT ↔ EXECUTE → RECORDING │
│            → END  (v2.4: 6状态)                 │
│  (PostToolUse state_enforce.sh 警告越界)         │
└─────────────────────────────────────────────────┘</div>
    <h3>FSM 5 状态</h3>
    <ul>
      <li><b>BOOT</b>：session 启动，建状态文件</li>
      <li><b>PREPARE</b>：cache_hit_map、4 要素 checklist、估算资源</li>
      <li><b>REFLECT</b>：subagent rebuttal（pre-task / on-anomaly / post-task）— INFERENCE_GATE 也走 mini-REFLECT</li>
      <li><b>EXECUTE_LOOP</b>：执行 + 每步 [PLAN]/[OBSERVE]</li>
      <li><b>RECORDING</b>（v2.4 新）：专用台账写入 state；EXECUTE_EXIT 强制经过此 state，不再直接回 REFLECT</li>
      <li><b>END</b>：最终 user 汇报（台账已在 RECORDING 写完）</li>
    </ul>
    <h3>三道防线（对抗跳步病）</h3>
    <ol>
      <li>状态机本身 — state-aware router 每 turn 注入当前 state 的允许/禁止操作清单</li>
      <li>REFLECT post-task 的 subagent rebuttal — 检查 deliverable</li>
      <li>PREPARE 4 要素 prompt enhancement（observable / cadence / reflection / completion）— 由 <code>prompt_enhancement.md</code> 强制</li>
    </ol>
    <h3>git 仓库构成 (v2.1)</h3>
    <ul>
      <li><code>content/rules/*.md</code> — 9 顶层 policy 文件</li>
      <li><code>content/rules/states/*.md</code> — 5 state 描述</li>
      <li><code>content/rules/router_*.md + router.md</code> — 5 state-aware router + 1 fallback</li>
      <li><code>content/rules/patches/*.md</code> — 5 scenario 补丁</li>
      <li><code>content/rules/messages/*.md</code> — 2 hook string 外置</li>
      <li><code>content/rules/workflow_config.yaml</code> — 常量集中</li>
      <li><code>hooks/*.sh</code> — 9 个脚本（含新增 <code>_session_lib.sh</code>、<code>state_enforce.sh</code>）</li>
      <li><code>set_claude.sh</code> — 部署器</li>
      <li><code>docs/</code> — 设计文档</li>
    </ul>
  `,

  flow: () => `
    <h2>3. 端到端流程 (v2.1)</h2>
    <p>一次完整 session 里、用户从输入 prompt 到 AI 输出结果的所有阶段。</p>
    <div class="ascii">USER: 「帮我跑这个训练，监控直到跑完」
        │
        ▼ UserPromptSubmit 触发
┌─────────────────────────────────────────────────┐
│ Hook 1: inject_router.sh  (state-aware v2.1)    │
│  → 读 .barry_workflow/&lt;sid&gt;/state.md           │
│  → cat 对应 router_&lt;STATUS&gt;.md 块                │
│  → 没 state 则 cat router.md (fallback)         │
│                                                 │
│ Hook 2: session_boot.sh   (subdir v2.1)         │
│  → 检查 $PWD 像不像项目根                         │
│  → 没 &lt;sid&gt;/ 子目录就建 + 复制 template          │
│  → P17: 检测旧 sid → 写 inherited_from           │
└─────────────────────────────────────────────────┘
        │
        ▼ AI 开始处理 prompt
┌─────────────────────────────────────────────────┐
│ AI 进入 BOOT 状态                                │
│  → 看 router_BOOT 知道只能 Read，不能 Edit       │
│  → 写 [BOOT_DONE @ ts] 到 action.md             │
│  → 调 transition.sh BOOT_DONE → state=PREPARE   │
└─────────────────────────────────────────────────┘
        │
        ▼
┌─────────────────────────────────────────────────┐
│ AI 进入 PREPARE 状态                             │
│  → 跑 prepare_helper.sh                         │
│    输出 cache_hit_map stub + messages/           │
│    prepare_checklist.md (4 要素)                 │
│  → 估算 T_queue / T_run                         │
│  → 调 transition.sh PREPARE_DONE → REFLECT      │
└─────────────────────────────────────────────────┘
        │
        ▼

// helpers
function policyCard({title, what, why, integrate, verdict, verdictText, snippet}) {
  return `
    <h2>${title}</h2>
    <div class="what-why-grid">
      <div class="cell what"><div class="label">What — 干啥</div>${what}</div>
      <div class="cell why"><div class="label">Why — 为啥要</div>${why}</div>
    </div>
    <h3>怎么集成进 FSM</h3>
    <p>${integrate}</p>
    <h3>有效性</h3>
    <div class="cell verdict ${verdict}"><div class="label">verdict</div>${verdictText}</div>
    ${snippet ? `<h3>关键内容</h3><pre><code>${snippet}</code></pre>` : ""}
  `;
}
function hookCard({title, what, why, file, size, when, verdict, verdictText}) {
  return `
    <h2>${title}</h2>
    <div class="what-why-grid">
      <div class="cell what"><div class="label">What — 干啥</div>${what}</div>
      <div class="cell why"><div class="label">Why — 为啥要</div>${why}</div>
    </div>
    <h3>元数据</h3>
    <ul>
      <li><b>文件位置</b>：<code>${file}</code></li>
      ${size ? `<li><b>大小</b>：${size}</li>` : ""}
      <li><b>触发</b>：${when}</li>
    </ul>
    <h3>有效性</h3>
    <div class="cell verdict ${verdict}"><div class="label">verdict</div>${verdictText}</div>
  `;
}
function patchCard(filename, scenario, summary, state) {
  return `
    <h2>patches/${filename}</h2>
    <ul>
      <li><b>scenario</b>: ${scenario}</li>
      <li><b>applies_to.state</b>: ${state}</li>
    </ul>
    <h3>核心内容</h3>
    <p>${summary}</p>
    <h3>装载</h3>
    <p>当前需 AI 自己判场景并 Read。v2.2 计划：基于 applies_to.triggers (关键字 list) 自动 detect。</p>
    <div class="cell verdict warn"><div class="label">verdict</div>⚠ 静态文件已部署，<b>无自动加载</b>，靠 AI 自觉。</div>
  `;
}

const detail = document.getElementById("detail");
function show(key) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.key === key));
  detail.innerHTML = SECTIONS[key]();
  detail.scrollTop = 0;
}
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => show(b.dataset.key));
});
show("intro");
</script>
