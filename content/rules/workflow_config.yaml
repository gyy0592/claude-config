# workflow_config.yaml — central tunables for the barry-workflow state machine.
# Edit values here, rerun set_claude.sh, no hook/.md edits needed.
# As of v2.1 P13 this file is a SOURCE-OF-TRUTH REFERENCE; hooks and state docs
# do not yet read it at runtime — they cite it via inline comments so future
# changes know the one place to edit. Wiring the shells to source this YAML
# is a follow-up task.

reflect:
  rounds_default: 5         # states/reflect.md "N (round budget)"
  rounds_fallback: 10       # states/reflect.md "N=5 hits → re-spawn at N=10"
  max_round_minutes: 15     # cap a single rebuttal round; exceeded → log + escalate
  # v2.5.5: count-based hard guard on REFLECT_DONE. When true, transition.sh
  # counts tool_use events of type Agent/Task/SendMessage in the session
  # transcript and refuses REFLECT_DONE unless: ≥1 Agent or Task spawn AND
  # ≥(rounds_default - 1) SendMessage. Default off so existing sessions don't
  # break; opt in once your team is ready.
  enforce_min_rounds: false

execute_loop:
  failure_budget: 3         # states/execute.md + hooks/execute_loop_audit.sh anomaly threshold
                            # see also failure_stop.md (autonomous-3-failure stop)

pretool_nudge:
  read_threshold: 3         # hooks/pretooluse_short_nudge.sh — Read/Grep/Glob count → nudge dispatch
  max_chars: 100            # hooks/pretooluse_short_nudge.sh — nudge() truncates message to this length

# v2.5.4 / v2.5.5: Stop hook (hooks/stop_bg_aware.sh) gating.
# enabled — master kill-switch. Default false → hook is a no-op (silent allow)
#   for everyone who hasn't explicitly opted in. Set true to turn the
#   haiku-judge gate on for this repo. See docs/stop_gate.md for details.
# bg_stale_minutes — a bg task is "fresh" if its /tmp/.../tasks/<id>.output
#   mtime is within this many minutes. Older → treat as not pending and
#   consult the haiku-judge gate.
stop_gate:
  enabled: false
  bg_stale_minutes: 30

cache_refresh:
  # v2.4 F3 / v2.5: hooks/cache_refresh_check.sh — PostToolUse now (v2.5 moved from
  # UserPromptSubmit so long autonomous tasks still trigger). Emits a banner
  # listing the full ledger self-check.
  threshold_input_tokens: 200000

# v2.5 / v2.5.3: state-aware reinforcement — every ~10k input_tokens, PostToolUse
# hook re-injects the FULL router_<STATE>.md so long autonomous loops don't drift
# from the state's allowed/forbidden + autonomy. v2.5.3 removed the 400-char cap
# because it was cutting off the always-on footer (autonomy etc.) — the exact
# part AI most needed. max_chars is now informational only (hook ignores it).
state_reinforce:
  threshold_input_tokens: 10000
  max_chars: 0   # 0 = no cap; hook injects full router file

# v2.5: REFLECT-state rebuttal nag — PreToolUse hook fires every tool call
# while current_status==REFLECT AND no Agent / SendMessage call has been
# recorded yet in this session.
reflect_nag:
  enabled: false
  max_chars: 200

# v2.5: ledger paths cited in cache_refresh banner.
ledger_paths:
  global_lessons: "~/.claude/rules/lessons.md"
  global_violations: "~/.claude/rules/violation.md"
  project_bitter_lessons: "workspace/bitter_lessons.md"
  project_rule_violations: "workspace/rule_violations.md"
  project_successful_fixes: "workspace/successful_fixes.md"
  project_attempts_ledger: "workspace/attempts_ledger.md"

# v2.5.1 (F3 fix): pretool_ledger_guard.sh hook denies Edit/Write/NotebookEdit
# on these path globs when current_status ≠ RECORDING. Adding a new ledger here
# extends the guard without touching hook code (general / robust per user
# L249 — never hardcode file names in hook scripts).
recording:
  guarded_paths:
    - "workspace/bitter_lessons.md"
    - "workspace/successful_fixes.md"
    - "workspace/rule_violations.md"
    - "workspace/attempts_ledger.md"
    - "content/templates/global_rules/lessons.md"
    - "content/templates/global_rules/violation.md"

# v2.5.5: per-state tool deny list. PreToolUse hook pretool_state_tool_guard.sh
# reads this table — when current_status matches a key here AND the tool being
# called is in that state's deny_tools list, the call is denied with a
# permissionDecisionReason hint. Soft mechanism (PreToolUse permissionDecision)
# not a kill — AI sees the reason and decides whether to transition first.
# Empty/missing entry = no restriction. State names match FSM exactly.
state_tool_policy:
  BOOT:
    deny_tools: [Agent, Task, Edit, Write, NotebookEdit]
  # PREPARE/REFLECT/EXECUTE_LOOP/RECORDING/END not listed = no extra tool
  # restrictions beyond existing hooks (ledger guard / reflect nag).

prompt_reinforce:
  required_elements:        # hooks/prepare_helper.sh + states/prepare.md "4-element check"
    - observable
    - cadence
    - reflection
    - completion
